<header
  class="fixed top-0 z-50 w-full border-b border-slate-700/50 bg-slate-900/80 backdrop-blur-md transition-all duration-300"
>
  <div class="container mx-auto flex items-center justify-between px-6 py-4">
    <a
      routerLink="/"
      class="text-2xl font-bold tracking-tight text-white transition hover:opacity-80"
    >
      <span class="bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">
        Rafay
      </span>
      Shah
    </a>

    <nav class="hidden items-center space-x-8 md:flex">
      <a
        routerLink="/home"
        routerLinkActive="text-indigo-400 font-semibold"
        class="text-sm font-medium text-slate-300 transition-colors hover:text-white"
      >
        Home
      </a>
      <a
        routerLink="/experience"
        routerLinkActive="text-indigo-400 font-semibold"
        class="text-sm font-medium text-slate-300 transition-colors hover:text-white"
      >
        Experience
      </a>
      <a
        routerLink="/skills"
        routerLinkActive="text-indigo-400 font-semibold"
        class="text-sm font-medium text-slate-300 transition-colors hover:text-white"
      >
        Skills
      </a>

      <a
        routerLink="/contact"
        class="rounded-full bg-indigo-600 px-5 py-2 text-sm font-semibold text-white shadow-lg shadow-indigo-500/30 transition-all hover:bg-indigo-500 hover:shadow-indigo-500/50 hover:-translate-y-0.5 active:translate-y-0"
      >
        Hire Me
      </a>
    </nav>

    <button
      (click)="toggleMenu()"
      class="rounded-lg p-2 text-slate-300 hover:bg-slate-800 hover:text-white focus:outline-none md:hidden"
      aria-label="Toggle menu"
    >
      <svg
        *ngIf="!isMenuOpen"
        xmlns="http://www.w3.org/2000/svg"
        class="h-6 w-6"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 6h16M4 12h16m-7 6h7"
        />
      </svg>

      <svg
        *ngIf="isMenuOpen"
        xmlns="http://www.w3.org/2000/svg"
        class="h-6 w-6"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M6 18L18 6M6 6l12 12"
        />
      </svg>
    </button>
  </div>

  <div *ngIf="isMenuOpen" class="border-t border-slate-700 bg-slate-900 md:hidden">
    <nav class="flex flex-col space-y-4 px-6 py-6">
      <a
        routerLink="/home"
        (click)="toggleMenu()"
        routerLinkActive="text-indigo-400 bg-slate-800"
        class="rounded-md px-3 py-2 text-base font-medium text-slate-300 hover:bg-slate-800 hover:text-white"
      >
        Home
      </a>
      <a
        routerLink="/experience"
        (click)="toggleMenu()"
        routerLinkActive="text-indigo-400 bg-slate-800"
        class="rounded-md px-3 py-2 text-base font-medium text-slate-300 hover:bg-slate-800 hover:text-white"
      >
        Experience
      </a>
      <a
        routerLink="/skills"
        (click)="toggleMenu()"
        routerLinkActive="text-indigo-400 bg-slate-800"
        class="rounded-md px-3 py-2 text-base font-medium text-slate-300 hover:bg-slate-800 hover:text-white"
      >
        Skills
      </a>
      <a
        routerLink="/contact"
        (click)="toggleMenu()"
        class="mt-2 block w-full rounded-lg bg-indigo-600 px-3 py-3 text-center text-base font-semibold text-white shadow-md active:bg-indigo-700"
      >
        Hire Me
      </a>
    </nav>
  </div>
</header>
